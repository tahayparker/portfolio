name = "portfolio"
main = ".open-next/worker.js"
compatibility_date = "2025-10-16"
compatibility_flags = ["nodejs_compat"]

# This is the correct way to bind static assets for OpenNext.
# It creates the "ASSETS" binding that the worker script needs.
# Do NOT create a KV namespace for this.
[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[[r2_buckets]]
binding = "PORTFOLIO_IMAGES"
bucket_name = "tahayparker-portfolio"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "cache"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
